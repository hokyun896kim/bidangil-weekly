name: 한주에한번매매 스캐너

on:
  schedule:
    # 매주 금요일 16:00 KST (07:00 UTC) — 장 마감 후
    - cron: "0 7 * * 5"
  workflow_dispatch:
    inputs:
      top:
        description: "시총 상위 N (0 = 전 종목)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader yfinance pandas numpy requests

      - name: 스캔 실행
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_TOP:         ${{ github.event.inputs.top || '0' }}
        run: python scan_bot.py

      - name: 상태·로그 저장
        run: |
          git config user.name  "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scan_state.json scan_log.csv || true
          git diff --staged --quiet || git commit -m "scan $(date -u +%F)"
          git push || true
