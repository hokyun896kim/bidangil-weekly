<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>비단길 주봉 매매판</title>
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4472f'/%3E%3Crect x='8' y='9' width='5' height='14' fill='%23fff'/%3E%3Crect x='19' y='13' width='5' height='10' fill='%23fff' opacity='.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 토스 스타일: 회색 바탕 위 흰 카드, 큰 숫자, 둥근 칩, 하단 탭바. 상승 빨강 · 하락 파랑 */
:root{
  --bg:#f2f4f6; --card:#ffffff; --fill:#f2f4f6; --fill-2:#f9fafb; --line:#e5e8eb;
  --text:#191f28; --text-2:#333d4b; --muted:#6b7684; --faint:#8b95a1; --dim:#b0b8c1;
  --blue:#3182f6; --blue-bg:#e8f3ff;
  --up:#f04452; --down:#3182f6; --ma:#ff9f00; --stop:#8b95a1;
  --buy:#f04452;  --buy-bg:#ffeeee;
  --wait:#f59f00; --wait-bg:#fff4e0;
  --new:#03b26c;  --new-bg:#e5f8ef;
  --halt:#6b7684; --halt-bg:#f2f4f6;
  --warn:#e5503b; --warn-bg:#fff0ed;
  --nav:#ffffffee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101013; --card:#1c1c21; --fill:#2b2b32; --fill-2:#24242a; --line:#2f2f37;
    --text:#f2f2f4; --text-2:#d5d5da; --muted:#9e9ea7; --faint:#7e7e88; --dim:#5d5d66;
    --blue:#4c94ff; --blue-bg:#1d2a40;
    --up:#ff5c69; --down:#4c94ff; --ma:#ffb53d; --stop:#7e7e88;
    --buy:#ff5c69;  --buy-bg:#3a1f24;
    --wait:#ffb53d; --wait-bg:#3a2e17;
    --new:#2fd08a;  --new-bg:#163126;
    --halt:#9e9ea7; --halt-bg:#2b2b32;
    --warn:#ff7a63; --warn-bg:#3a221d;
    --nav:#1c1c21ee;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101013; --card:#1c1c21; --fill:#2b2b32; --fill-2:#24242a; --line:#2f2f37;
  --text:#f2f2f4; --text-2:#d5d5da; --muted:#9e9ea7; --faint:#7e7e88; --dim:#5d5d66;
  --blue:#4c94ff; --blue-bg:#1d2a40;
  --up:#ff5c69; --down:#4c94ff; --ma:#ffb53d; --stop:#7e7e88;
  --buy:#ff5c69;  --buy-bg:#3a1f24;
  --wait:#ffb53d; --wait-bg:#3a2e17;
  --new:#2fd08a;  --new-bg:#163126;
  --halt:#9e9ea7; --halt-bg:#2b2b32;
  --warn:#ff7a63; --warn-bg:#3a221d;
  --nav:#1c1c21ee;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.num,.tnum{font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* 헤더 */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 4px 16px}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.02em}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:-.01em;margin-top:2px}
.theme-btn{flex:none;border:0;background:var(--card);color:var(--muted);border-radius:999px;font-size:13px;font-weight:600;padding:8px 12px;cursor:pointer}

/* 섹션 = 흰 카드 */
.sec{background:var(--card);border-radius:24px;padding:22px 20px;margin-bottom:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 14px}
h2{font-size:19px;line-height:1.35;margin:0;font-weight:700;letter-spacing:-.02em}
h2 .cnt{font-size:15px;font-weight:600;color:var(--blue);margin-left:4px}
.sec-h .aside{font-size:13px;color:var(--faint)}
.sub{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--faint);margin:12px 0 0;line-height:1.55}

/* 상단 요약 */
.hero-k{font-size:15px;color:var(--muted);font-weight:500}
.hero-v{font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;border-radius:8px;padding:4px 9px;white-space:nowrap;background:var(--fill);color:var(--text-2)}
.b-final{background:var(--new-bg);color:var(--new)}
.b-draft,.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-flag{background:var(--fill);color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:500;margin-bottom:12px;line-height:1.5}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.chip{display:block;text-decoration:none;border-radius:16px;padding:14px 4px 12px;text-align:center;background:var(--fill-2)}
.chip b{display:block;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.chip span{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.chip.zero b{color:var(--dim)}
.c-buy b{color:var(--buy)} .c-wait b{color:var(--wait)} .c-new b{color:var(--new)} .c-halt b{color:var(--halt)}

/* 종목 카드 */
.card{background:var(--card);border-radius:24px;padding:22px 20px 18px;margin-bottom:12px}
.st-pill{display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:3px 9px;margin-bottom:10px}
.s-buy .st-pill{background:var(--buy-bg);color:var(--buy)} .s-wait .st-pill{background:var(--wait-bg);color:var(--wait)}
.s-new .st-pill{background:var(--new-bg);color:var(--new)} .s-halt .st-pill{background:var(--halt-bg);color:var(--halt)}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nm{font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.nm .code{font-size:14px;font-weight:500;color:var(--faint);margin-left:6px}
.px{text-align:right;flex:none}
.px b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.px .sub{margin-top:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rows{margin:16px 0 4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;font-size:15px}
.row span{color:var(--muted)}
.row b{font-weight:600;color:var(--text)}
.row b i{font-style:normal;font-weight:500;color:var(--faint);font-size:13px;margin-left:4px}
.spark{display:block;width:100%;height:110px;margin:10px 0 4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend b{font-weight:600}
.todo{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--st-bg);color:var(--st);font-size:16px;font-weight:700;text-align:center}
.s-buy .todo{--st-bg:var(--buy);--st:#fff} .s-wait .todo{--st-bg:var(--wait-bg);--st:var(--wait)}
.s-new .todo{--st-bg:var(--new-bg);--st:var(--new)} .s-halt .todo{--st-bg:var(--halt-bg);--st:var(--halt)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.links a{display:block;text-align:center;text-decoration:none;font-size:14px;font-weight:600;color:var(--text-2);background:var(--fill);border-radius:12px;padding:11px 0}
.empty{background:var(--fill-2);border-radius:16px;padding:18px;color:var(--muted);font-size:15px;line-height:1.55}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:2px}
.grp-h{display:flex;align-items:baseline;gap:6px;margin:26px 4px 12px}
.grp-h h2{font-size:20px}

/* 리스트 */
.diff-row{display:flex;gap:10px;align-items:center;padding:10px 0;font-size:15px}
.diff-row .sg{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.sg-new{background:var(--new-bg);color:var(--new)} .sg-chg{background:var(--wait-bg);color:var(--wait)} .sg-out{background:var(--fill);color:var(--faint)}
.check label{display:flex;gap:14px;align-items:flex-start;padding:12px 0;font-size:15px;cursor:pointer;font-weight:600}
.check input{margin-top:2px;width:22px;height:22px;accent-color:var(--blue);flex:none}
.check small{display:block;color:var(--faint);font-size:13px;font-weight:400;margin-top:2px}
.rules{width:100%;border-collapse:collapse;font-size:15px}
.rules th{text-align:left;font-weight:500;color:var(--muted);width:56px;padding:10px 10px 10px 0;vertical-align:top}
.rules td{padding:10px 0;color:var(--text-2);line-height:1.5}
.pos{color:var(--up)} .neg{color:var(--down)}
footer{margin:20px 4px 0;font-size:12px;color:var(--faint);line-height:1.7}
.err{padding:20px;border-radius:20px;background:var(--warn-bg);color:var(--warn)}

/* 하단 탭바 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--nav);
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:600;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--text)}
.tabs button:focus-visible,.theme-btn:focus-visible,.chip:focus-visible,.links a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 가상계좌 */
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.stat2 div{background:var(--fill-2);border-radius:16px;padding:14px}
.stat2 span{display:block;font-size:13px;color:var(--muted)}
.stat2 b{display:block;font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.stat2 i{font-style:normal;font-size:13px;color:var(--faint)}
.chart{display:block;width:100%;height:auto}
.chart text{font-size:10px;fill:var(--faint);font-family:inherit}
.pos-card{padding:16px 0;border-top:1px solid var(--line)}
.pos-card:first-of-type{border-top:0;padding-top:4px}
.pos-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pos-head .nm{font-size:17px}
.pos-head .r{text-align:right;flex:none}
.pos-head .r b{display:block;font-size:20px;font-weight:700}
.rng{position:relative;height:30px;margin:14px 6px 2px}
.rng .bar{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--fill)}
.rng .fill{position:absolute;top:12px;height:6px;border-radius:3px}
.rng .tick{position:absolute;top:7px;width:2px;height:16px;border-radius:1px;background:var(--faint)}
.rng .dot{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--card);border:4px solid var(--text)}
.rng-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.ev{display:flex;gap:12px;align-items:center;padding:12px 0;font-size:15px}
.ev .d{flex:none;width:44px;color:var(--faint);font-size:13px}
.ev .t{flex:none;font-weight:700;font-size:13px;border-radius:8px;padding:3px 0;min-width:56px;text-align:center}
.ev .t.buy{color:var(--buy);background:var(--buy-bg)} .ev .t.win{color:var(--new);background:var(--new-bg)}
.ev .t.loss{color:var(--down);background:var(--blue-bg)} .ev .t.skip{color:var(--faint);background:var(--fill)}
.ev .m{min-width:0;line-height:1.45}
.ev .m .sub{display:block}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp th,.cmp td{padding:10px 4px;text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--muted);font-weight:500}
.cmp thead th{font-size:13px;color:var(--faint);font-weight:600}
.cmp td{font-weight:600}
.wk{padding:14px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0;padding-top:0}
.wk-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:16px}
.wk-cnt{display:flex;gap:10px;font-size:13px;color:var(--muted)}
.wk-cnt b{font-weight:700}
.wk-names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:13px;font-weight:600;border-radius:8px;padding:3px 9px;background:var(--fill);color:var(--text-2)}
.pill.buy{background:var(--buy-bg);color:var(--buy)} .pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.new{background:var(--new-bg);color:var(--new)} .pill.halt{background:var(--halt-bg);color:var(--halt)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none}
.mini .go{font-size:14px;color:var(--blue);font-weight:600;flex:none}
.mini .big{font-size:24px;font-weight:700;letter-spacing:-.02em}
/* 자동 체크 */
.ck{margin-top:14px;border-radius:16px;background:var(--fill-2);padding:14px 16px}
.ck-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ck-h b{font-size:15px}
.ck-v{font-size:13px;font-weight:700;border-radius:8px;padding:3px 10px}
.ck-v.v-pass{background:var(--new-bg);color:var(--new)} .ck-v.v-warn{background:var(--wait-bg);color:var(--wait)}
.ck-v.v-out{background:var(--buy);color:#fff} .ck-v.v-unk{background:var(--fill);color:var(--muted)}
.ck ul{list-style:none;margin:10px 0 0;padding:0}
.ck li{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:4px 0;color:var(--text-2)}
.ck li .lv{flex:none;font-size:12px;font-weight:700;width:30px}
.ck li .lv.out{color:var(--buy)} .ck li .lv.warn{color:var(--wait)}
.ck li .dt{flex:none;margin-left:auto;font-size:12px;color:var(--faint)}
.ck .ok{font-size:14px;color:var(--muted);margin:8px 0 0}
.ck .nw{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ck .nw a{display:block;font-size:13px;color:var(--text-2);text-decoration:none;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck .nw a span{color:var(--faint);margin-right:6px}
.s-out .todo{--st-bg:var(--fill);--st:var(--muted)}
@media (max-width:360px){
  .chip b{font-size:22px}
  .hero-v{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.sec{animation:up .28s ease-out both}
  @keyframes up{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>비단길 주봉<small>한주에한번매매 · 매주 금요일 자동 갱신</small></h1>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="테마 전환">자동</button>
  </header>
  <main id="app"><p class="sub">불러오는 중…</p></main>
  <section id="acct" hidden></section>
  <section id="log" hidden></section>
  <footer>
    판정은 scanner.py 4조건 그대로이고, 이 페이지는 규칙 실행용 표예요. 투자 권유가 아니에요.<br>
    데이터 Yahoo Finance 주봉 · 종목 목록 KRX(FinanceDataReader) · 가상계좌는 규칙을 기계적으로 실행한 모의 기록이에요.
  </footer>
</div>

  <button type="button" role="tab" id="tab-acct" data-tab="acct" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>가상계좌</button>
  <button type="button" role="tab" id="tab-log" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>기록</button>

<script>
(function(){
"use strict";

/* ── 테마 ───────────────────────────── */
var THEMES=["auto","light","dark"], LABEL={auto:"자동",light:"라이트",dark:"다크"};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  document.getElementById("themeBtn").textContent=LABEL[t];
}
var theme=store("bdg-theme")||"auto"; if(THEMES.indexOf(theme)<0)theme="auto";
applyTheme(theme);
document.getElementById("themeBtn").addEventListener("click",function(){
  theme=THEMES[(THEMES.indexOf(theme)+1)%3]; store("bdg-theme",theme); applyTheme(theme);
});

/* ── 유틸 ───────────────────────────── */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function won(n){return n==null?"—":Number(n).toLocaleString("ko-KR")}
function pct(n,plus){if(n==null)return"—";var s=Number(n).toFixed(1);return (plus&&n>0?"+":"")+s+"%"}
var DOW="일월화수목금토";
function md(iso){if(!iso)return"";var d=new Date(iso+"T00:00:00");return (d.getMonth()+1)+"/"+d.getDate()+"("+DOW[d.getDay()]+")"}

var ST={
  "매수":   {cls:"buy", label:"매수", todo:"오늘 종가에 사고, +12% 예약매도"},
  "대기":   {cls:"wait",label:"대기", todo:"첫 음봉 나오는 금요일 종가에 매수"},
  "신규조건":{cls:"new", label:"신규", todo:"첫 음봉 나올 때까지 기다려요"},
  "중단":   {cls:"halt",label:"중단", todo:"이번 신호는 버려요"}
};
var ORDER=["매수","대기","신규조건","중단"];

/* ── 미니 캔들 (한국식: 양봉 빨강 / 음봉 파랑) ───── */
function candles(w,stop){
  var W=320,H=110,P=6,n=w.length; if(!n)return"";
  var lo=Infinity,hi=-Infinity;
  w.forEach(function(b){lo=Math.min(lo,b[3]);hi=Math.max(hi,b[2]);if(b[5]!=null){lo=Math.min(lo,b[5]);hi=Math.max(hi,b[5])}});
  if(stop!=null){lo=Math.min(lo,stop);hi=Math.max(hi,stop)}
  if(hi===lo)hi=lo+1;
  var y=function(v){return P+(hi-v)/(hi-lo)*(H-2*P)};
  var step=W/n, bw=Math.max(3,step*0.58), out=[], ma=[];
  w.forEach(function(b,i){
    var cx=step*i+step/2, o=b[1],h=b[2],l=b[3],c=b[4], up=c>=o, col=up?"var(--up)":"var(--down)";
    var top=y(Math.max(o,c)), bh=Math.max(1.5,Math.abs(y(o)-y(c)));
    out.push('<line x1="'+cx.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y1="'+y(h).toFixed(1)+'" y2="'+y(l).toFixed(1)+'" stroke="'+col+'" stroke-width="1.2"/>');
    out.push('<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1" fill="'+col+'"/>');
    if(b[5]!=null)ma.push(cx.toFixed(1)+","+y(b[5]).toFixed(1));
  });
  var stopLine=stop!=null?'<line x1="0" x2="'+W+'" y1="'+y(stop).toFixed(1)+'" y2="'+y(stop).toFixed(1)+'" stroke="var(--stop)" stroke-width="1.2" stroke-dasharray="4 4"/>':"";
  var maLine=ma.length>1?'<polyline points="'+ma.join(" ")+'" fill="none" stroke="var(--ma)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':"";
  var label="최근 "+n+"주 주봉 ("+esc(w[0][0])+"~"+esc(w[n-1][0])+")";
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+label+'">'+stopLine+out.join("")+maLine+'</svg>';
}

/* ── 자동 체크 블록 ─────────────────── */
var CKV={"통과":"v-pass","주의":"v-warn","제외":"v-out","미확인":"v-unk"};
function checkBlock(ck){
  if(!ck)return "";
  var rs=(ck.reasons||[]).map(function(r){
    var lv=r.level==="제외"?"out":"warn";
    return '<li><span class="lv '+lv+'">'+esc(r.level)+'</span><span>'+esc(r.text)+'</span>'+(r.date?'<span class="dt num">'+esc(r.date)+'</span>':'')+'</li>';
  }).join("");
  var body=rs?'<ul>'+rs+'</ul>':'<p class="ok">관리·경고·거래정지, 감사의견·자본잠식, 증자·감자·분할 공시 모두 없어요.</p>';
  var nw=(ck.news||[]).length?'<div class="nw">'+ck.news.map(function(n){return '<a href="'+esc(n.url)+'" target="_blank" rel="noopener"><span class="num">'+esc(n.date)+'</span>'+esc(n.title)+'</a>'}).join("")+'</div>':"";
  return '<div class="ck"><div class="ck-h"><b>매수 전 자동 체크</b><span class="ck-v '+(CKV[ck.verdict]||"v-unk")+'">'+esc(ck.verdict)+'</span></div>'+body+nw+'</div>';
}

  var tv="https://www.tradingview.com/chart/?symbol=KRX%3A"+encodeURIComponent(it.code)+"&interval=W";
  var nv="https://m.stock.naver.com/domestic/stock/"+encodeURIComponent(it.code)+"/total";

   +'<span class="st-pill">'+s.label+'</span>'

   +'<div class="sub">'+mkt+' · 조건주 '+esc((it.cond_week||"—").slice(5).replace("-","/"))+' · 이번 주 '+esc(it.bar)+'</div></div>'
   +'<div class="px"><b class="num">'+won(it.close)+'</b><span class="sub">종가</span></div></div>'
   +(badges.length?'<div class="badges">'+badges.join("")+'</div>':"")
   +'<div class="rows">'
   +'<div class="row"><span>목표가 +12%</span><b class="num pos">'+target+'</b></div>'
   +'<div class="row"><span>'+(it.state==="중단"?"이탈한 손절선":"손절선")+'</span><b class="num neg">'+won(it.stop)+'원<i>'+(it.stop_pct!=null?pct(it.stop_pct,true):"")+'</i></b></div>'
   +'<div class="row"><span>104주선 대비</span><b class="num">'+pct(vs104,true)+'</b></div>'
   +'</div>'
   +candles(it.weekly||[],it.stop)
   +'<div class="legend"><span><i style="background:var(--ma)"></i>104주선 '+won(it.ma104)+'</span>'
   +'<span><i style="background:var(--stop)"></i>손절선</span>'
   +'<span class="num">26주 '+won(it.ma26)+' · 52주 '+won(it.ma52)+'</span></div>'
   +checkBlock(it.check)
   +'<div class="todo">'+(out?"체크에 걸려 매수하지 않아요":s.todo)+'</div>'
   +'<div class="links"><a href="'+nv+'" target="_blank" rel="noopener">네이버증권</a><a href="'+tv+'" target="_blank" rel="noopener">트레이딩뷰 주봉</a></div>'
   +'</article>';

/* ── 섹션들 ─────────────────────────── */
function sectionStates(d){

/* ── 가상계좌 ───────────────────────── */
function man(n){return n==null?"—":(Math.round(n/1000)/10).toLocaleString("ko-KR",{minimumFractionDigits:1,maximumFractionDigits:1})+"만원"}
function sgn(n){return n>0?"pos":(n<0?"neg":"")}
function wonS(n){return n==null?"—":(n>0?"+":"")+won(Math.round(n))+"원"}

function equityChart(eq){
  var W=340,H=170,L=34,R=10,T=10,B=22,n=eq.length;
  if(n<2)return '<p class="sub">자산 곡선은 2주 이상 쌓이면 그려져요.</p>';
  var start=eq[0].equity, ser=[
    {k:"내 계좌",col:"var(--blue)",w:2.6,v:eq.map(function(r){return (r.equity/start-1)*100})},
    {k:"코스피",col:"var(--faint)",w:1.4,v:eq.map(function(r){return r.KOSPI})},
    {k:"코스닥",col:"var(--dim)",w:1.4,dash:"4 3",v:eq.map(function(r){return r.KOSDAQ})}
  ].filter(function(s){return s.v.some(function(x){return x!=null})});
  var lo=0,hi=0; ser.forEach(function(s){s.v.forEach(function(x){if(x!=null){lo=Math.min(lo,x);hi=Math.max(hi,x)}})});
  var pad=Math.max(1,(hi-lo)*0.08); lo-=pad; hi+=pad;
  var x=function(i){return L+(W-L-R)*i/(n-1)}, y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)};
  var step=(hi-lo)>20?10:((hi-lo)>8?5:((hi-lo)>4?2:1)), g=[];
  for(var v=Math.ceil(lo/step)*step;v<=hi;v+=step){
    g.push('<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="'+(v===0?1.4:0.8)+'"/>');
    g.push('<text x="'+(L-4)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end">'+(v>0?"+":"")+v+'%</text>');
  }
  [0,Math.floor((n-1)/2),n-1].filter(function(v,i,a){return a.indexOf(v)===i}).forEach(function(i){
    var d=eq[i].date||eq[i].week;
    g.push('<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":(i===n-1?"end":"middle"))+'">'+esc(d.slice(5).replace("-","/"))+'</text>');
  });
  var lines=ser.slice().reverse().map(function(s){
    var pts=[];s.v.forEach(function(v,i){if(v!=null)pts.push(x(i).toFixed(1)+","+y(v).toFixed(1))});
    var last=s.v[n-1];
    return '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+s.col+'" stroke-width="'+s.w+'"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+' stroke-linejoin="round" stroke-linecap="round"/>'
      +(last!=null?'<circle cx="'+x(n-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="'+(s.k==="내 계좌"?4:2.5)+'" fill="'+s.col+'"/>':"");
  }).join("");
  var leg=ser.map(function(s){var v=s.v[n-1];return '<span><i style="background:'+s.col+'"></i>'+s.k+' <b class="num '+sgn(v)+'">'+(v==null?"—":pct(v,true))+'</b></span>'}).join("");
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="주간 자산 곡선, 시작 대비 수익률">'+g.join("")+lines+'</svg><div class="legend" style="margin-top:8px">'+leg+'</div>';
}

function rangeBar(p){
  var lo=p.stop, hi=p.target, cur=p.last_close, en=p.entry_price;
  if(cur==null||hi<=lo)return "";
  var f=function(v){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100))};
  var a=f(en), b=f(cur), left=Math.min(a,b), wdt=Math.abs(b-a), col=cur>=en?"var(--up)":"var(--down)";
  return '<div class="rng" aria-hidden="true"><div class="bar"></div><div class="fill" style="left:'+left.toFixed(1)+'%;width:'+wdt.toFixed(1)+'%;background:'+col+'"></div>'
    +'<div class="tick" style="left:'+a.toFixed(1)+'%"></div><div class="dot" style="left:'+b.toFixed(1)+'%"></div></div>'
    +'<div class="rng-lbl"><span class="num">손절 '+won(Math.round(lo))+' ('+pct(p.to_stop_pct,true)+')</span><span class="num">목표 '+won(Math.round(hi))+' ('+pct(p.to_target_pct,true)+')</span></div>';
}

function posCard(p){

    +'<div class="sub">'+esc((p.entry_date||"").slice(5).replace("-","/"))+' 매수 · '+won(Math.round(p.entry_price))+'원 × '+won(p.qty)+'주 · '+(p.weeks||0)+'주째</div></div>'
    +'<div class="r"><b class="num '+cls+'">'+pct(p.unreal_pct,true)+'</b><span class="sub num">'+wonS(amt)+'</span></div></div>'
    +rangeBar(p)
    +(p.stop_pct<-20?'<div class="badges"><span class="badge b-warn">진입 때 손절선 '+pct(p.stop_pct)+'</span></div>':"")
    +'</div>';
}

  var all=st.all_signals||{}, rows=["신호 수","청산","승률","평균 수익","평균 익절","평균 손절","평균 보유"], A=statCol(a), S=statCol(all);
  h+='<section class="sec"><div class="sec-h"><h2>계좌 vs 신호 전체</h2></div><table class="cmp"><thead><tr><th></th><th>계좌</th><th>신호 전체</th></tr></thead><tbody>'
    +rows.map(function(r,i){return '<tr><td>'+r+'</td><td class="num">'+A[i]+'</td><td class="num">'+S[i]+'</td></tr>'}).join("")
    +'</tbody></table><p class="note">신호 전체에는 자리가 없어 못 산 신호도 같은 규칙으로 추적해 넣었어요. 수익률은 왕복 비용 '+(c.cost_pct||0.3)+'% 뺀 값이에요.</p></section>';
  h+='<p class="note" style="margin:4px 4px 0">규칙: 매수 시점 평가액의 '+Math.round((c.weight||0.05)*100)+'%, 최대 '+(c.slots||8)+'종목, +'+(c.target_pct||12)+'% 예약매도(갭 상승은 시가), 손절선 고정·주봉 종가 이탈 시 청산, 같은 주에 겹치면 익절 우선.'
    +(c.max_stop_pct?' 손절선이 '+c.max_stop_pct+'%보다 먼 신호는 사지 않음.':'')+'</p>';
  el.innerHTML=h;
}

function miniAcct(L){
  if(!L||!L.stats||!L.stats.equity)return "";
  var e=L.stats.equity, a=L.stats.account, op=(L.open_positions||[]).length;
  return '<a class="sec mini" href="#acct" data-goto="acct"><span><span class="hero-k">가상계좌</span><br><span class="big num">'+man(e.now)+'</span> <b class="num '+sgn(e.ret_pct)+'">'+pct(e.ret_pct,true)+'</b><br>'
    +'<span class="sub">보유 '+op+'종목 · '+(a.closed?a.wins+"승 "+a.losses+"패":"청산 없음")+'</span></span><span class="go">자세히 ›</span></a>';
}

/* ── 기록 ───────────────────────────── */
function renderLog(W){
  var el=document.getElementById("log");
  if(!W||!W.length){el.innerHTML='<section class="sec"><div class="empty"><b>주간 기록이 아직 없어요</b>금요일 스캔이 확정될 때마다 한 줄씩 쌓여요.</div></section>';return}
  el.innerHTML='<section class="sec"><div class="sec-h"><h2>주간 스캔 기록</h2><span class="aside">'+W.length+'회</span></div>'+W.map(function(w){
    var c=w.counts||{};
    var cnt=ORDER.map(function(st){var s=ST[st];return '<span>'+s.label+' <b class="num" style="color:'+((c[st]||0)?'var(--'+s.cls+')':'var(--dim)')+'">'+(c[st]||0)+'</b></span>'}).join("");
    var names=(w.items||[]).map(function(x){var s=ST[x.state]||{cls:""};return '<span class="pill '+s.cls+'">'+esc(x.name)+'</span>'}).join("");
    return '<div class="wk"><div class="wk-top"><b>'+esc(md(w.last_trading_day||w.scan_date))+' 마감</b><span class="wk-cnt">'+cnt+'</span></div>'+(names?'<div class="wk-names">'+names+'</div>':'')+'</div>';
  }).join("")+'</section>';
}

/* ── 탭 ─────────────────────────────── */
var TABS={week:"app",acct:"acct",log:"log"};
function showTab(t){
  if(!TABS[t])t="week";
  Object.keys(TABS).forEach(function(k){
    document.getElementById(TABS[k]).hidden=(k!==t);
    document.getElementById("tab-"+k).setAttribute("aria-selected",k===t?"true":"false");
  });
  try{history.replaceState(null,"",t==="week"?location.pathname:"#"+t)}catch(e){}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){showTab((location.hash||"").replace("#","")||"week")});
document.querySelector(".tabs").addEventListener("click",function(ev){var b=ev.target.closest("button[data-tab]");if(b)showTab(b.getAttribute("data-tab"))});
document.addEventListener("click",function(ev){var a=ev.target.closest("[data-goto]");if(a){ev.preventDefault();showTab(a.getAttribute("data-goto"))}});

/* ── 렌더 ───────────────────────────── */
function render(d,L){
  var c=d.counts||{}, ltd=d.last_trading_day, nBuy=c["매수"]||0, nWait=c["대기"]||0;
  var head='';
  if(d.demo)head+='<div class="banner"><b>샘플 데이터예요.</b> 실제 종목이 아니에요. 첫 자동 실행 뒤 실데이터로 바뀌어요.</div>';
  if(!d.bar_final)head+='<div class="banner">이번 주 주봉이 아직 안 끝났어요. 마지막 거래일 장 마감 전 값이라 바뀔 수 있어요.</div>';
  else if(ltd&&new Date(ltd+"T00:00:00").getDay()!==5)head+='<div class="banner">이번 주는 금요일이 휴장이라 '+md(ltd)+' 종가로 마감됐어요.</div>';
  var title=nBuy?('이번 주 매수 <span class="pos">'+nBuy+'종목</span>'):(nWait?('매수 없음 · 대기 '+nWait+'종목'):'이번 주는 쉬어가요');
  head+='<section class="sec"><div class="hero-k">'+esc(md(ltd||d.scan_date))+' 마감 기준</div>'
    +'<div class="hero-v">'+title+'</div>'
    +'<div class="meta">'+(d.bar_final?'<span class="badge b-final">확정</span>':'<span class="badge b-draft">주중 미확정</span>')
    +'<span class="badge num">전 종목 '+won(d.universe)+'</span>'
    +((d.excluded||d.failed)?'<span class="badge b-flag num">제외 '+won((d.excluded||0)+(d.failed||0))+'</span>':"")+'</div>'
    +'<nav class="chips" aria-label="상태 요약">'+ORDER.map(function(st){
      var s=ST[st], n=c[st]||0;
      return '<a class="chip c-'+s.cls+(n?"":" zero")+'" href="#st-'+s.cls+'"><b class="num">'+n+'</b><span>'+s.label+'</span></a>';
    }).join("")+'</nav></section>';

  var ckKey="bdg-check-"+d.scan_date;
  document.getElementById("app").innerHTML=head+sectionStates(d)+'<div style="height:12px"></div>'+miniAcct(L)+sectionDiff(d.diff)+sectionRules();
  var box=document.getElementById("checklist");
  box&&box.addEventListener("change",function(){
    var o={}; box.querySelectorAll("input").forEach(function(x){if(x.checked)o[x.getAttribute("data-i")]=1});
    store(ckKey,JSON.stringify(o));
  });
}

function getJSON(u,optional){
  return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok){if(optional)return null;throw new Error("HTTP "+r.status)}return r.json()})
    .catch(function(e){if(optional)return null;throw e});
}
Promise.all([getJSON("data/latest.json"),getJSON("data/ledger.json",true),getJSON("data/weeks.json",true)])
  .then(function(r){
    render(r[0],r[1]); renderAcct(r[1]); renderLog(r[2]);
    showTab((location.hash||"").replace("#","")||"week");
  })
  .catch(function(e){
    document.getElementById("app").innerHTML='<div class="err">데이터를 불러오지 못했습니다 ('+esc(e.message)+').<br>'
      +'로컬에서 파일을 직접 열었다면 <code>python -m http.server -d docs</code> 로 띄워 주세요.</div>';
  });
})();
</script>
</body>
</html>
